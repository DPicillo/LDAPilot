name: CI

# Tests and builds for Linux, Windows and macOS on every push to master and every
# pull request. Builds are published ONLY when a release is made: a pushed tag v*
# creates the GitHub release (notes from CHANGELOG.md) with all builds attached.
# "Run workflow" by hand only tests and builds (downloadable run artifacts), it
# never touches a release.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WAILS_VERSION: v2.17.0
  NODE_VERSION: '22'

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System libraries (GTK, WebKitGTK 4.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Frontend dependencies and bindings
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.placeholder
          (cd frontend && npm ci --no-audit --no-fund)
          wails generate module

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi

      - name: Go build, vet and test
        run: |
          go build ./...
          go vet ./internal/... ./services/... .
          go test ./...

      - name: Design token lint gates
        run: scripts/lint-tokens.sh

      - name: TypeScript, frontend tests and Vite build
        working-directory: frontend
        run: |
          npx tsc --noEmit -p .
          node --test 'tests/*.test.ts'
          node --test 'tests/ai/*.test.mjs'
          npx vite build

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (WebKitGTK 4.0)
            os: ubuntu-22.04
            platform: linux/amd64
            apt: libgtk-3-dev libwebkit2gtk-4.0-dev
            args: ''
          - name: Linux (WebKitGTK 4.1)
            os: ubuntu-24.04
            platform: linux/amd64
            apt: libgtk-3-dev libwebkit2gtk-4.1-dev
            args: '-tags webkit2_41'
          - name: Windows
            os: windows-latest
            platform: windows/amd64
            args: '-nsis'
          - name: macOS (universal)
            os: macos-latest
            platform: darwin/universal
            args: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: NSIS (installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build (version, commit and date stamped)
        run: bash scripts/build.sh -platform ${{ matrix.platform }} ${{ matrix.args }}

      - name: Collect the files
        run: |
          mkdir -p out
          case "${{ matrix.os }}" in
            ubuntu-22.04) cp build/bin/LDAPilot out/LDAPilot-linux-amd64 ;;
            ubuntu-24.04) cp build/bin/LDAPilot out/LDAPilot-linux-amd64-webkit2_41 ;;
            windows-*)
              cp build/bin/LDAPilot.exe out/LDAPilot-windows-amd64.exe
              cp build/bin/LDAPilot-amd64-installer.exe out/LDAPilot-windows-amd64-installer.exe ;;
            macos-*) ditto -c -k --keepParent build/bin/LDAPilot.app out/LDAPilot-macos-universal.zip ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: ldapilot-${{ matrix.os }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create the release if needed (notes from CHANGELOG.md)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists."
            exit 0
          fi
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^Earlier versions:/ || /^\[[0-9.]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "LDAPilot $TAG" > notes.md
          gh release create "$TAG" --verify-tag --title "LDAPilot $TAG" --notes-file notes.md

      - name: Upload the builds and SHA256SUMS.txt
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" * --clobber
